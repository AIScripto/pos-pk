version: '3.8'

services:
  # Express API container.
  # Uses the published image by default; switch to a `build: ./backend` block
  # when you want docker compose to build from local source instead.
  backend:
    image: tariqsulehri/aipos-be:latest
    ports:
      # Host:container. The API is reachable from the host at http://localhost:3500.
      - "3500:3500"
    environment:
      - NODE_ENV=development
      # Service-to-service hostname is `db` because the Postgres service below is named `db`.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/crip_crumbs
      # Public frontend origin used by backend redirects/CORS helpers.
      - CLIENT_URL=http://localhost:5000
      # Comma-separated browser origins allowed to call the API.
      - CORS_ORIGINS=http://localhost:5000,http://localhost:8080
      # Replace this in real deployments; checked in here only for local/demo compose.
      - JWT_SECRET=PIwJowmhmWZC4QJmAjZFocyFpVpA6usBXs1BmgnjNQw=
    depends_on:
      db:
        # Wait for Postgres readiness before running backend entrypoint migrations.
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aipos-network

  # Static Vite frontend served by Nginx.
  frontend:
    image: tariqsulehri/aipos-fe:latest
    ports:
      # Exposes Nginx on http://localhost:5000 while the container listens on port 80.
      - "5000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aipos-network

  # PostgreSQL database used by Prisma.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=crip_crumbs
    volumes:
      # Persist database files across container restarts.
      - postgres_data:/var/lib/postgresql/data
      # Optional SQL bootstrap scripts (uncomment if local ./postgres/init directory exists)
      # - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      # Exposed for local DB tools. Remove this mapping in locked-down deployments.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aipos-network

volumes:
  # Named volume keeps Postgres data outside the container lifecycle.
  postgres_data:

networks:
  # Private bridge network so services can talk via service names: backend, frontend, db.
  aipos-network:
    driver: bridge
